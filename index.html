<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryzan9</title>
  <link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./styles/body.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/hero.css">
  <link rel="stylesheet" href="./styles/footer.css">
</head>

<body>
  <header>
    <div class="logo">Ryzan's Sci-Fi Hub</div>
    <nav>
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <div class="hero">
    <h1>Welcome to the Future</h1>
    <p>Explore the realms of technology, gaming, and sci-fi.</p>
    <div class="cta">
      <a href="#projects">Discover More</a>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Ryzan. All rights reserved.</p>
  </footer>

  <script>
    document.querySelector('.cta a').addEventListener('click', function (event) {
      event.preventDefault();

      for (let i = 0; i < 10; i++) {
        const icon = document.createElement('i');
        icon.className = 'fas fa-hand-middle-finger';
        icon.style.position = 'absolute';
        icon.style.left = Math.random() * window.innerWidth + 'px';
        icon.style.bottom = '0';
        icon.style.fontSize = '2rem';
        icon.style.color = '#00ffcc';
        icon.style.animation = 'flyUp 3s ease-out forwards';
        document.body.appendChild(icon);

        setTimeout(() => {
          icon.remove();
        }, 3000);
      }
    });

    const style = document.createElement('style');
    style.textContent = `
      @keyframes flyUp {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>

</html>
